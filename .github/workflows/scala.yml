name: Scala CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  scalafmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: coursier/setup-action@v3
        with:
          apps: scalafmt
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **.scala
            **.sbt
      - name: Run Scalafmt on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: scalafmt ${{ steps.changed-files.outputs.all_changed_files }}
      - name: Check if there are any changes
        id: verify-diff
        run: git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT
      - name: Commit files
        if: steps.verify-diff.outputs.changed == 'true'
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git commit -a -m "style: Run Scalafmt"
      - name: Push changes
        if: steps.verify-diff.outputs.changed == 'true'
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Install sbt
      uses: sbt/setup-sbt@v1
    - name: Run tests
      run: sbt "coverage; test; coverageReport"
    - name: Locate coverage report
      id: coverage-file
      run: |
        coverage_file="$(find target -type f -path "*/scoverage-report/scoverage.xml" | head -n 1)"
        if [ -z "$coverage_file" ]; then
          coverage_file="$(find target -type f -path "*/coverage-report/cobertura.xml" | head -n 1)"
        fi
        if [ -z "$coverage_file" ]; then
          echo "Coverage report file not found under target/" >&2
          exit 1
        fi
        echo "file=$coverage_file" >> "$GITHUB_OUTPUT"
    - name: Upload coverage report
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ steps.coverage-file.outputs.file }}
        disable_search: true

  assembly:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Install sbt
      uses: sbt/setup-sbt@v1
    - name: Run assembly
      run: sbt assembly
    - name: Archive artifact
      uses: actions/upload-artifact@v6
      with:
        name: medicate-assembly.jar
        path: target/out/jvm/scala-3.3.8/medicate/medicate-assembly-0.1.0.jar
